<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NERONOVA 2026 | National Level Cyberpunk Hackathon</title>
    <!-- Google Fonts for Cyberpunk Aesthetic: Orbitron, Rajdhani, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

        color: #ffffff;
        overflow-x: hidden;
      }
      .font-orbitron {
        font-family: 'Orbitron', monospace, sans-serif;
      }
      .font-rajdhani {
        font-family: 'Rajdhani', sans-serif;

      /* Custom Cyberpunk Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;

        background: #E50914;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(229, 9, 20, 0.8);

      ::-webkit-scrollbar-thumb:hover {
        background: #FF3030;
      }

  <body class="bg-[#090909] text-white antialiased selection:bg-[#E50914] selection:text-white">
