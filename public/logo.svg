<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="neonRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3030" />
      <stop offset="50%" stop-color="#E50914" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="cyberBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowBlue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Tech Hex/Polygon Border -->
  <polygon points="100,10 185,55 185,145 100,190 15,145 15,55" 
           fill="#090909" stroke="#E50914" stroke-width="4" stroke-linejoin="round" filter="url(#glowRed)"/>

  <!-- Inner Tech Circuit Lines -->
  <polyline points="40,65 100,30 160,65" fill="none" stroke="#FF3030" stroke-width="2" opacity="0.6"/>
  <polyline points="40,135 100,170 160,135" fill="none" stroke="#FF3030" stroke-width="2" opacity="0.6"/>

  <!-- Stylized Cyberpunk 'N' Shape -->
  <!-- Left Pillar -->
  <polygon points="50,45 75,45 75,155 50,155" fill="url(#neonRedGrad)"/>
  <!-- Right Pillar -->
  <polygon points="125,45 150,45 150,155 125,155" fill="url(#neonRedGrad)"/>
  <!-- Diagonal Bar -->
  <polygon points="68,52 92,45 132,148 108,155" fill="#FF3030" filter="url(#glowRed)"/>

  <!-- Center Evil-Eye / Cyber Core glowing accent -->
  <circle cx="100" cy="100" r="12" fill="#001a40" stroke="#00d2ff" stroke-width="3" filter="url(#glowBlue)"/>
  <circle cx="100" cy="100" r="5" fill="#00f0ff"/>
  <circle cx="100" cy="100" r="2" fill="#ffffff"/>
</svg>
